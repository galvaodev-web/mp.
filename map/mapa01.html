  function base64ToBytes(value) {
    const binary = atob(value);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i);
    return bytes;
  }

  async function inflateGzip(bytes) {
    if (!('DecompressionStream' in window)) {
      throw new Error('Este navegador não suporta descompactação gzip nativa.');
    }

    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    return await new Response(stream).text();
  }

  try {
    const html = await inflateGzip(base64ToBytes(payload));
    document.open();
    document.write(html);
    document.close();
  } catch (error) {
    document.body.innerHTML = '<p style="font-family:Arial,sans-serif;padding:24px">Não foi possível carregar o mapa. Abra em um navegador atualizado.</p>';
    console.error(error);
  }
